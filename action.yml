name: 'Send Discord message'
description: 'Send a formatted Discord notification on every push — commit links, branch, author, and changelog using Discord Components v2.'
branding:
  icon: git-commit
  color: blue

inputs:
  id:
    description: 'Discord webhook ID — the first segment of the webhook URL (discord.com/api/webhooks/{ID}/{TOKEN})'
    required: true
  token:
    description: 'Discord webhook token — the second segment of the webhook URL'
    required: true
  threadId:
    description: 'Send the message to a specific thread inside the webhook channel (Discord thread snowflake ID)'
    required: false

runs:
  using: 'node24'
  main: 'dist/index.cjs'
