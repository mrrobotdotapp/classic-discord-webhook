name: "Bug Report"
description: "Something isn't working as expected? Report it here."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Workflow file
      description: Paste your workflow YAML (remove secrets).
      render: yaml
  - type: textarea
    attributes:
      label: Error output
      description: Paste the GitHub Actions log output if available.
      render: text
  - type: textarea
    attributes:
      label: Anything else?
