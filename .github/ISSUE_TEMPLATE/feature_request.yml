name: "Feature Request"
description: "Want something added to the project? Fill out this form."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting a feature! Please fill out the sections below.
  - type: textarea
    attributes:
      label: Summary
      description: Clearly describe what you want to happen.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Have you checked existing issues?
      description: Make sure there's no duplicate request already open.
      options:
        - "Yes, I checked"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else?
